{% extends "base.html" %}


{% block title %} Registrar {% endblock %}


{% block contenido %}

<h1 class="titulo_lecciones"> Agregar nueva clase </h1>



  <form class="form" method="POST">

    <p class = "form_input">

      <label for="Titulo">Titulo de la clase:</label>
      <input type="text" name="Titulo" id="Titulo" class="Titulo" required>
    </p>


    <p class = "form_input">

      <label for="Contenido">Contenido:</label>
      <textarea name="Contenido" id="Contenido" class="Contenido" rows="4" required></textarea>

    </p>

    <p class = "form_input">

      <label for="Codigo">Codigo de ejemplo:</label>
      <textarea name="Codigo" id="Codigo" class="Codigo" rows="10" style="font-family: monospace;" required></textarea>

    </p>



    <button type="submit" class="form_submit">Agregar</button>

  </form>






{% endblock %}
